# Local test instance: never talks to a real Miniflux, Karakeep or MeTube.
# Own project name and own data directory, so it cannot share a database or
# secret.key with a real instance. See docs/development.md.
#
#   docker compose -f compose.dev.yaml up -d --build
name: siftstr-dev
services:
  siftstr:
    build: .
    ports:
      # Localhost only: the dev login is admin/admin123.
      - "127.0.0.1:8081:8080"
    environment:
      SIFTSTR_ADMIN_USER: admin
      SIFTSTR_ADMIN_PASSWORD: admin123
      # Plain http on localhost: no BASE_URL, so cookies are not Secure.
      TZ: ${TZ:-UTC}
    volumes:
      # Bind mount so `go run ./cmd/seed` on the host can reach the database.
      - ./.local/dev-data:/data
