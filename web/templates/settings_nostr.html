{{define "content"}}
<h1>Nostr</h1>
{{template "settingsnav" .}}
<p>Siftstr reads notes and long-form articles from the npubs you follow, from the relays you list. Replies are skipped. Each npub appears as a source on the Sources page.</p>
<form method="post" action="/settings/nostr">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <label>Relays
    <textarea name="relays" rows="4" placeholder="wss://relay.example.com" autocomplete="off" spellcheck="false">{{.NostrRelays}}</textarea>
    <small>One per line, ws:// or wss://.</small>
  </label>
  <label>Followed npubs
    <textarea name="npubs" rows="8" placeholder="npub1..." autocomplete="off" spellcheck="false">{{.NostrNpubs}}</textarea>
    <small>One per line. A hex public key also works. Removing one stops new posts; its source stays on the Sources page.</small>
  </label>
  <button type="submit">{{if .NostrSaved}}Save{{else}}Connect{{end}}</button>
</form>
{{if .NostrSaved}}
<form method="post" action="/settings/nostr/delete" class="inline">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <button type="submit" class="secondary outline">Disconnect</button>
</form>
{{end}}
{{end}}
