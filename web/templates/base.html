{{define "base"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{if .Title}}{{.Title}} · {{end}}Siftstr</title>
  <link rel="stylesheet" href="/static/pico.min.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body{{if .User}} data-user-id="{{.User.ID}}" data-csrf="{{.CSRF}}"{{end}}>
  <header class="container">
    <nav>
      <ul><li><strong>Siftstr</strong></li><li><small class="sync" data-sync-status role="status" aria-live="polite" hidden></small></li></ul>
      {{if .User}}
      <ul>
        <li><a href="/today"{{if eq .Active "today"}} aria-current="page"{{end}}>Today</a></li>
        <li><a href="/backlog"{{if eq .Active "backlog"}} aria-current="page"{{end}}>Backlog</a></li>
        <li><a href="/read"{{if eq .Active "read"}} aria-current="page"{{end}}>Read</a></li>
        <li><a href="/settings/sources"{{if eq .Active "settings"}} aria-current="page"{{end}}>Settings</a></li>
        <li>
          <form method="post" action="/logout" class="inline" data-logout>
            <input type="hidden" name="csrf" value="{{.CSRF}}">
            <button type="submit" class="secondary outline">Sign out</button>
          </form>
        </li>
      </ul>
      {{end}}
    </nav>
  </header>
  <main class="container">
{{template "content" .}}
  </main>
  {{if .User}}<script src="/static/queue.js"></script>
  <script src="/static/sync.js"></script>
  <script src="/static/gestures.js"></script>{{end}}
</body>
</html>{{end}}
